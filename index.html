<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端资产 · 配色库</title>
<style>
  :root{
    --paper:#F8F4ED; --card:#FCFAF5; --ink:#3B3D3F; --ink-soft:#6B6F73; --ink-faint:#8E9196;
    --line:rgba(122,96,88,.18); --accent:#537D96;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:400 14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 24px 96px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
  .sub{font-size:12px;color:var(--ink-faint)}
  .tabs{display:flex;gap:6px;margin:18px 0 20px}
  .tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  .fam{margin-bottom:22px}
  .fam__head{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .fam__name{font-size:13.5px;font-weight:600}
  .fam__en{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase}
  .fam__tag{font-size:10.5px;color:var(--accent);border:1px solid rgba(83,125,150,.3);
    border-radius:999px;padding:1px 7px}
  .fam__note{font-size:11.5px;color:var(--ink-soft);margin-left:auto}
  .ramp{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .sw{flex:1;height:52px;position:relative;cursor:pointer;border:0;padding:0}
  .sw span{position:absolute;left:5px;bottom:3px;font-size:9.5px;font-family:ui-monospace,monospace;opacity:.75}
  .sw:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
  .sw.pick{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .card__body{padding:10px 12px 11px}
  .card__name{font-size:13px;font-weight:600}
  .card__meta{font-size:10.5px;color:var(--ink-faint);font-family:ui-monospace,monospace;margin-top:2px}
  .card .ramp{border:0;border-radius:0}

  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:10px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12.5px}
  .bar b{font-family:ui-monospace,monospace;font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .chip i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:block}
  .verdict{padding:2px 9px;border-radius:999px;font-size:11.5px}
  .v-ok{background:rgba(83,125,150,.12);color:#3E5F73}
  .v-warn{background:rgba(193,123,84,.16);color:#8A5330}
  .v-bad{background:rgba(139,58,58,.14);color:#8B3A3A}
  .hint{font-size:11.5px;color:var(--ink-faint)}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:6px 14px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .18s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>配色库</h1>
    <span class="sub" id="sub"></span>
  </header>

  <div class="tabs">
    <button data-tab="neutral" class="on">中性色</button>
    <button data-tab="accent">亮色</button>
  </div>

  <div id="neutral"></div>
  <div id="accent" hidden></div>
</div>

<div class="bar" id="bar">
  <span class="hint" id="barHint">点两个色块，看它们之间的对比是否克制</span>
  <span class="chip" id="c1" hidden><i></i><b></b></span>
  <span class="chip" id="c2" hidden><i></i><b></b></span>
  <span id="result"></span>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

/* --- 对比计算 --- */
const hexRgb = h => { const s = h.replace('#',''); return [0,2,4].map(i => parseInt(s.slice(i,i+2),16)); };
const lin = c => { const v = c/255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
const lum = h => { const [r,g,b] = hexRgb(h).map(lin); return 0.2126*r + 0.7152*g + 0.0722*b; };
const ratio = (a,b) => { const [x,y] = [lum(a), lum(b)].sort((p,q)=>q-p); return (x+0.05)/(y+0.05); };
const labL = h => {
  const [r,g,b] = hexRgb(h).map(lin);
  const y = (0.2126729*r + 0.7151522*g + 0.0721750*b);
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787*t + 16/116;
  return 116*f(y) - 16;
};

let picked = [];
let toastTimer;

const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1100);
};

const copy = (hex) => {
  navigator.clipboard?.writeText(hex).then(() => toast('已复制 ' + hex)).catch(() => toast(hex));
};

const onPick = (btn, hex) => {
  btn.classList.toggle('pick');
  if (btn.classList.contains('pick')) picked.push(hex);
  else picked = picked.filter(x => x !== hex);
  if (picked.length > 2) picked = picked.slice(-2);
  renderBar();
};

const renderBar = () => {
  const [a, b] = picked;
  $('#c1').hidden = !a; $('#c2').hidden = !b;
  if (a) { $('#c1 i').style.background = a; $('#c1 b').textContent = a; }
  if (b) { $('#c2 i').style.background = b; $('#c2 b').textContent = b; }
  const out = $('#result');
  out.innerHTML = '';
  if (!a || !b) { $('#barHint').hidden = false; return; }
  $('#barHint').hidden = true;

  const dL = Math.abs(labL(a) - labL(b));
  const cr = ratio(a, b);
  let cls = 'v-ok', word = '克制';
  if (dL > 50 || cr > 9) { cls = 'v-bad'; word = '对比过强'; }
  else if (dL > 35 || cr > 5) { cls = 'v-warn'; word = '接近上限'; }

  out.append(el('span', '', `ΔL ${dL.toFixed(1)} · 对比 ${cr.toFixed(2)}:1 `));
  out.append(el('span', 'verdict ' + cls, word));
};

/* --- 渲染中性色 --- */
const renderNeutral = (data) => {
  const box = $('#neutral'); box.innerHTML = '';
  data.families.forEach(fam => {
    const wrap = el('div', 'fam');
    const head = el('div', 'fam__head');
    head.append(el('span', 'fam__name', fam.name_zh));
    head.append(el('span', 'fam__en', fam.name_en));
    head.append(el('span', 'fam__tag', fam.tone));
    if (fam.derived) head.append(el('span', 'fam__tag', '推导'));
    head.append(el('span', 'fam__note', fam.note));
    wrap.append(head);

    const ramp = el('div', 'ramp');
    fam.steps.forEach(st => {
      const b = el('button', 'sw');
      b.style.background = st.hex;
      b.title = `${fam.id}-${st.step}  ${st.hex}\nHSL ${st.hsl}\nLab ${st.lab}`;
      const label = el('span', '', String(st.step));
      const onWhite = ratio(st.hex, '#FFFFFF');
      const onInk = ratio(st.hex, '#1C1917');
      label.style.color = onInk > onWhite ? '#FFFFFF' : '#1C1917';
      label.style.opacity = '.85';
      b.append(label);
      b.onclick = () => { copy(st.hex); onPick(b, st.hex); };
      ramp.append(b);
    });
    wrap.append(ramp);
    box.append(wrap);
  });
  $('#sub').textContent = `${data.families.length} 组 · ${data.families.reduce((a,f)=>a+f.steps.length,0)} 色 · 官方 ${data.families.filter(f=>!f.derived).length} 组 + 推导 ${data.families.filter(f=>f.derived).length} 组`;
};

/* --- 渲染亮色 --- */
const renderAccent = (data) => {
  const box = $('#accent'); box.innerHTML = '';
  const grid = el('div', 'grid');
  data.colors.forEach(c => {
    const card = el('div', 'card');
    const ramp = el('div', 'ramp');
    ['tint','light','base','deep'].forEach(k => {
      const st = c.steps[k];
      const b = el('button', 'sw');
      b.style.background = st.hex;
      b.style.height = '40px';
      b.title = `${c.id}-${k}  ${st.hex}\n对比浅底 ${st.contrastOnLight}:1 · 深底 ${st.contrastOnDark}:1`;
      b.onclick = () => { copy(st.hex); onPick(b, st.hex); };
      ramp.append(b);
    });
    const body = el('div', 'card__body');
    body.append(el('div', 'card__name', `${c.name_zh} · ${c.name_en}`));
    body.append(el('div', 'card__meta', `base ${c.steps.base.hex} · 浅底 ${c.steps.base.contrastOnLight}:1`));
    card.append(ramp, body);
    grid.append(card);
  });
  box.append(grid);
  const p = el('p', 'hint', data.rule);
  p.style.marginTop = '14px';
  box.append(p);
};

/* --- 启动 --- */
const boot = async () => {
  const [n, a] = await Promise.all([
    fetch('./colors/data/neutrals.json').then(r => r.json()),
    fetch('./colors/data/accents.json').then(r => r.json())
  ]);
  renderNeutral(n);
  renderAccent(a);

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === btn));
      const tab = btn.dataset.tab;
      $('#neutral').hidden = tab !== 'neutral';
      $('#accent').hidden = tab !== 'accent';
      picked = [];
      document.querySelectorAll('.sw.pick').forEach(s => s.classList.remove('pick'));
      renderBar();
      if (tab === 'accent') $('#sub').textContent = `${a.colors.length} 色相 × 4 档 = ${a.colors.length * 4} 色`;
      else $('#sub').textContent = `${n.families.length} 组 · ${n.families.reduce((x,f)=>x+f.steps.length,0)} 色`;
    };
  });

  const want = new URLSearchParams(location.search).get('tab');
  if (want === 'accent') document.querySelector('.tabs button[data-tab="accent"]').click();
};

boot().catch(err => {
  document.body.insertAdjacentHTML('beforeend',
    `<p style="padding:24px;color:#8B3A3A">数据加载失败：${err.message}。请用 http 方式打开（node serve.mjs）。</p>`);
});
</script>
</body>
</html>
