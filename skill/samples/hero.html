<!doctype html>
<html lang="zh-CN" data-ramp="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黄金样本 · Hero</title>
<link rel="stylesheet" href="../tokens.css">
<!--
  黄金样本 #1：一屏 hero
  用途：给 SKILL.md 当参照物。规则写得再细，不如一张达标的页面。

  对照的规则：
    · 档位 A（1.75 / 1.25 / 1.0）
    · 色：stone 系中性，单一强调色（青瓷 teal），视觉重量 <5%
    · 留白：区块间距 96 / 内部 24 = 4:1
    · 圆角：外层 12 / 内层 8 / 控件 6
    · 动效：只有一个焦点时刻（标题分期入场，≤700ms），其余静止
    · 控件层：导航滚动后变矮 + 半透明，回滚复原
    · 特效面积：噪点 3% + 导航模糊 ≤15%
  发现的问题：
    · 现有刻度最大 2.125rem（34px），撑不住 1440px 宽的 hero。
      这里临时用了 3.25rem，说明刻度需要补 display 级（见报告）。
-->
<style>
  :root {
    --bg: #FAFAF9;          /* stone-50 */
    --surface: #FFFFFF;
    --ink: #292524;         /* stone-800 */
    --ink-soft: #57534E;    /* stone-600 */
    --ink-faint: #A8A29E;   /* stone-400 */
    --line: rgba(120, 113, 108, 0.18);
    --accent: #1A6E68;      /* 青瓷 teal，压到对比 5.9:1（原 #1F827A 只有 4.44，不够 AA） */
    --accent-soft: rgba(26, 110, 104, 0.10);

    --display: 3.25rem;     /* 52px，超出当前刻度，见注释 */
    --display-lh: 1.12;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: var(--body);
    line-height: var(--lh-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ============ 控件层：导航，滚动退让 ============ */
  .nav {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px var(--gutter);
    background: transparent;
    border-bottom: 1px solid transparent;
    transition:
      padding var(--dur-state) var(--ease),
      background var(--dur-state) var(--ease),
      border-color var(--dur-state) var(--ease);
  }
  .nav[data-shrunk="true"] {
    padding: 12px var(--gutter);
    background: rgba(250, 250, 249, 0.82);
    backdrop-filter: blur(12px);
    border-bottom-color: var(--line);
  }
  .nav__brand {
    font-size: var(--body);
    font-weight: var(--weight-title);
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--ink);
  }
  .nav__links { display: flex; gap: var(--space-5); }
  .nav__links a {
    font-size: var(--meta);
    color: var(--ink-soft);
    text-decoration: none;
    transition: color var(--dur-instant) var(--ease);
  }
  .nav__links a:hover { color: var(--ink); }

  /* ============ 内容层 ============ */
  .hero {
    max-width: var(--container);
    margin: 0 auto;
    padding: 120px var(--gutter) 64px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hero__eyebrow {
    font-size: var(--meta);
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 var(--space-5);
  }

  .hero__title {
    font-family: var(--font-display);
    font-size: var(--display);
    line-height: var(--display-lh);
    font-weight: var(--weight-title);
    /* 中文标题不做负字距：拉丁字体的习惯，中文会变挤 */
    letter-spacing: 0;
    margin: 0 0 var(--space-5);
    max-width: 18em;
  }
  /* 一个焦点时刻：逐词上浮，总时长 640ms，间隔 70ms */
  .hero__title .w {
    display: inline-block;
    opacity: 0;
    transform: translateY(12px);
    animation: rise var(--dur-enter) var(--ease) forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .hero__lede {
    font-size: var(--body);
    line-height: var(--lh-body);
    color: var(--ink-soft);
    max-width: 28em;
    margin: 0 0 var(--space-7);
  }

  .hero__actions {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    margin-bottom: var(--space-9);
  }

  /* 控件：圆角 6，唯一一处用强调色 */
  .btn {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 0 var(--space-5);
    border-radius: var(--radius-control);
    background: var(--ink);
    color: var(--bg);
    font-size: var(--meta);
    font-weight: var(--weight-title);
    text-decoration: none;
    border: 1px solid var(--ink);
    transition: background var(--dur-instant) var(--ease), color var(--dur-instant) var(--ease);
  }
  .btn:hover { background: #181615; border-color: #181615; }

  .link-quiet {
    font-size: var(--meta);
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
    padding-bottom: 2px;
    transition: border-color var(--dur-instant) var(--ease);
  }
  .link-quiet:hover { border-bottom-color: var(--accent); }

  /* 索引：三行元信息，内部间距 24，与上方隔 96 */
  .index {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-5);
    padding-top: var(--space-5);
    border-top: 1px solid var(--line);
    margin-bottom: var(--space-9);
  }
  .index__item { display: flex; flex-direction: column; gap: var(--space-1); }
  .index__k {
    font-size: var(--meta);
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .index__v { font-size: var(--body); color: var(--ink); }
  .index__v .num { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
  .hero__eyebrow { font-family: var(--font-mono); }

  /* 噪点：3% 面积，压住纯色的廉价感 */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.028;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  @media (max-width: 720px) {
    :root { --display: 2.25rem; --gutter: 24px; }
    .nav { padding: 16px var(--gutter); }
    .hero { padding-top: 132px; }
    .index { grid-template-columns: 1fr; gap: var(--space-4); }
    .hero__actions { gap: var(--space-4); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__title .w {
      transform: none;
      animation: fade var(--dur-state) linear forwards;
    }
    @keyframes fade { to { opacity: 1; } }
    .nav { transition: none; }
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="nav__brand" href="#">Yachin</a>
  <nav class="nav__links">
    <a href="#">作品</a>
    <a href="#">关于</a>
    <a href="#">联系</a>
  </nav>
</header>

<main class="hero">
  <p class="hero__eyebrow">Interaction Design · Front-end</p>

  <h1 class="hero__title" id="title">安静地做减法，把复杂的事讲清楚。</h1>

  <p class="hero__lede">
    交互设计与前端实现。克制的视觉，讲究的动效——动效只在一处发生，其余时间页面保持安静。
  </p>

  <div class="hero__actions">
    <a class="btn" href="#">看作品</a>
    <a class="link-quiet" href="#">读设计笔记 →</a>
  </div>

  <div class="index">
    <div class="index__item">
      <span class="index__k">项目</span>
      <span class="index__v"><span class="num">07</span> 个已完成</span>
    </div>
    <div class="index__item">
      <span class="index__k">方向</span>
      <span class="index__v">交互 / 视觉 / 前端</span>
    </div>
    <div class="index__item">
      <span class="index__k">状态</span>
      <span class="index__v">开放合作</span>
    </div>
  </div>
</main>

<script>
  /* 标题逐词入场：把文字按「，。、」与空格切分，逐块上浮 */
  (function () {
    const h = document.getElementById('title');
    const text = h.textContent.trim();
    const parts = text.split(/(?<=[，。、；])/).flatMap(s => s.split(/(?<=[，。、；])|\s+/));
    h.textContent = '';
    let i = 0;
    parts.forEach((chunk) => {
      if (!chunk) return;
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = chunk;
      span.style.animationDelay = (i * 70) + 'ms';
      i++;
      h.appendChild(span);
    });
  })();

  /* 控件退让：滚动超过 24px 收缩导航 */
  (function () {
    const nav = document.getElementById('nav');
    let raf = 0;
    const apply = () => {
      raf = 0;
      nav.dataset.shrunk = window.scrollY > 24 ? 'true' : 'false';
    };
    window.addEventListener('scroll', () => {
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive: true });
    apply();
  })();
</script>
</body>
</html>
